<title>Register - Understanding</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #001f3f, #0074D9, #85144b);
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    h1 {
        text-align: center;
        color: #d00;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #555;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 6px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 16px;
    }

    input:focus {
        outline: none;
        border-color: #0074D9;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 25px;
        border: none;
        border-radius: 7px;
        background: #0074D9;
        color: white;
        font-size: 17px;
        cursor: pointer;
    }

    button:hover {
        background: #005fa3;
    }

    #message {
        margin-top: 18px;
        text-align: center;
        font-weight: bold;
    }

    .links {
        text-align: center;
        margin-top: 20px;
    }

    .links a {
        color: #0074D9;
        text-decoration: none;
        font-weight: bold;
    }
</style>
<h1>Create Account</h1>

<p class="subtitle">
    Register to access the website.
</p>

<form id="registerForm">

    <label for="name">Full Name</label>

    <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
    >

    <label for="email">Email Address</label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
    >

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        placeholder="Create a password"
        required
    >

    <label for="confirmPassword">Confirm Password</label>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        required
    >

    <button type="submit">
        Register
    </button>

</form>

<div id="message"></div>

<div class="links">
    <p>
        Already have an account?
        <a href="login.html">Login here</a>
    </p>
</div>
